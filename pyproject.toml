[project]
name = "ai-trip-planner"
version = "0.1.0"
description = "Agentic AI Trip Planner using LangGraph, LangChain, Groq, Google Maps, and Streamlit"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    # UI
    "streamlit>=1.40.0",

    # Environment
    "python-dotenv>=1.0.1",
    "langchain-tavily>=0.2.18",

    # AI / LLM
    "langchain>=0.3.27",
    "langchain-core>=0.3.74",
    "langchain-community>=0.3.27",
    "langchain-openai>=0.3.30",
    "langchain-groq>=0.3.7",
    "langgraph>=0.6.6",

    # LLM APIs
    "openai>=1.99.9",
    "groq>=0.31.0",

    # Google Maps
    "googlemaps>=4.10.0",

    # Data Validation
    "pydantic>=2.11.7",

    # HTTP
    "requests>=2.32.4",
    "httpx>=0.28.1",

    # Data
    "pandas>=2.3.0",
    "numpy>=2.2.6",

    # FastAPI (if used)
    "fastapi>=0.116.1",
    "uvicorn>=0.35.0",

    # Utilities
    "python-multipart>=0.0.20",
    "typing-extensions>=4.14.1",
]